<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Neptune —— 习惯打卡、任务、专注计时、记账与数据统计，完全离线的个人自律工具。" />
    <meta name="theme-color" content="#FFF7F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2C272A" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Neptune" />
    <!-- 注意：必须用 %BASE_URL%，否则部署到子路径（/neptunee-app/）时图标会 404 -->
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/icon-180.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/favicon.png" />
    <title>Neptune</title>
    <script>
      // 在 React 挂载前就定好主题，避免深色模式用户冷启动时闪一下白屏。
      // 主题的权威来源是 IndexedDB，这里读的是同一份偏好的 localStorage 镜像。
      (function () {
        try {
          var pref = localStorage.getItem('nep-theme') || 'light'
          if (pref === 'system') {
            pref = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', pref === 'dark' ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
